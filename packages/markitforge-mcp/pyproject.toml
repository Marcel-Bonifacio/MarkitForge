[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitforge-mcp"
dynamic = ["version"]
description = 'An MCP server for the "markitforge" library.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
keywords = []
authors = [
  { name = "Adam Fourney", email = "adamfo@microsoft.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "mcp>=2.1.1,<3.0.0",
  "markitforge[all]>=0.1.9,<0.2.0",
]

[project.urls]
Documentation = "https://github.com/Marcel-Bonifacio/MarkitForge#readme"
Issues = "https://github.com/Marcel-Bonifacio/MarkitForge/issues"
Source = "https://github.com/Marcel-Bonifacio/MarkitForge"

[tool.hatch.version]
path = "src/markitforge_mcp/__about__.py"

[project.scripts]
markitforge-mcp = "markitforge_mcp.__main__:main"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/markitforge_mcp tests}"

[tool.coverage.run]
source_pkgs = ["markitforge-mcp", "tests"]
branch = true
parallel = true
omit = [
  "src/markitforge_mcp/__about__.py",
]

[tool.coverage.paths]
markitforge-mcp = ["src/markitforge_mcp", "*/markitforge-mcp/src/markitforge_mcp"]
tests = ["tests", "*/markitforge-mcp/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/markitforge_mcp", "LICENSE", "LICENSE-APACHE", "NOTICE"]
