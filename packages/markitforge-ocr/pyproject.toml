[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitforge-ocr"
dynamic = ["version"]
description = 'OCR plugin for MarkitForge - Extracts text from images in PDF, DOCX, PPTX, and XLSX via LLM Vision'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
keywords = ["markitforge", "ocr", "pdf", "docx", "xlsx", "pptx", "llm", "vision"]
authors = [
  { name = "Contributors", email = "noreply@github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]

# Core dependencies — matches the file-format libraries markitforge already uses
dependencies = [
  "markitforge>=0.2.0,<0.3.0",
  "pdfminer.six>=20251230",
  "pdfplumber>=0.11.9",
  "pypdfium2>=4.30.0",
  "mammoth>=1.12.2,<2",
  "python-docx",
  "python-pptx",
  "pandas",
  "openpyxl",
  "Pillow>=12.1.1",
]

# llm_client is passed in by the user (same as for markitforge image descriptions);
# install openai or any OpenAI-compatible SDK separately.
[project.optional-dependencies]
llm = [
  "openai>=1.0.0",
]

[project.urls]
Documentation = "https://github.com/Marcel-Bonifacio/MarkitForge#readme"
Issues = "https://github.com/Marcel-Bonifacio/MarkitForge/issues"
Source = "https://github.com/Marcel-Bonifacio/MarkitForge"

[tool.hatch.version]
path = "src/markitforge_ocr/__about__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src/markitforge_ocr", "README.md", "LICENSE", "LICENSE-APACHE", "NOTICE"]

# CRITICAL: Plugin entry point - MarkitForge will discover this plugin through this entry point
[project.entry-points."markitforge.plugin"]
ocr = "markitforge_ocr"
