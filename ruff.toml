# Ruff replaces Black (formatting) and adds fast linting.
target-version = "py310"
line-length = 88
extend-exclude = ["packages/*/tests/test_files"]

[format]
# Match Black's style so the switch causes no churn.
quote-style = "double"
indent-style = "space"

[lint]
# Start small: real bugs only (syntax errors, undefined names, unused imports/vars).
select = ["E9", "F63", "F7", "F82", "F401", "F841"]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/tests/**" = ["F401", "F841"]
