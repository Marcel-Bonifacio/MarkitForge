#
# Weekly: how far behind upstream MarkItDown are we, and would a sync conflict?
# Read-only; the result is shown in the run summary. Sync locally with
# `python scripts/sync_upstream.py --fetch` (see its docstring).
name: upstream-check
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Dry-run sync
        run: |
          {
            echo '## Upstream MarkItDown'
            echo '```'
            python scripts/sync_upstream.py --fetch --dry-run 2>&1 || code=$?
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = up to date, 1 = upstream has new commits; anything else is a failure.
          test "${code:-0}" -le 1
