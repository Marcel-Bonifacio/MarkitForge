name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

env:
  # Preserve Unicode in captured CLI output on Windows.
  PYTHONUTF8: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
  UV_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-11-vs2026-arm
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native Cryptography wheel
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: ./.github/actions/build-arm-cryptography

      - name: Install media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
          exiftool -ver
          ffmpeg -version
          ffprobe -version

      - name: Install Hatch
        run: pipx install hatch
      - name: Run tests
        working-directory: packages/markitforge
        run: hatch test --python "${{ matrix.python-version }}"


  ocr-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-11-vs2026-arm
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native Cryptography wheel
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: ./.github/actions/build-arm-cryptography

      # Install markitforge from the local checkout rather than PyPI, so the
      # plugin is tested against the sibling package it ships alongside.
      - name: Install packages
        run: pip install ./packages/markitforge ./packages/markitforge-ocr pytest

      - name: Run tests
        working-directory: packages/markitforge-ocr
        run: pytest


  mcp-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-11-vs2026-arm
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native Cryptography wheel
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: ./.github/actions/build-arm-cryptography

      - name: Install packages
        run: pip install "./packages/markitforge[all]" ./packages/markitforge-mcp pytest

      - name: Run tests
        working-directory: packages/markitforge-mcp
        run: pytest


  gui-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: pip install "./packages/markitforge[all]" "./packages/markitforge-gui[test]"

      - name: Run tests
        working-directory: packages/markitforge-gui
        run: pytest


  docs-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "./packages/markitforge[all]" reportlab python-docx openpyxl

      - name: Upstream sync script tests
        run: pip install pytest && python -m pytest -q scripts/test_sync_upstream.py

      - name: Formats doc is up to date
        run: python scripts/gen_formats_doc.py --check

      - name: Quality benchmark (fails on regression)
        run: python benchmarks/run_benchmark.py --check

      - name: Real-document corpus (fails on regression)
        run: python benchmarks/run_benchmark.py --corpus benchmarks/corpus --check


  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install "./packages/markitforge[all]" mypy
      - name: mypy
        run: mypy --ignore-missing-imports packages/markitforge/src/markitforge


  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install "./packages/markitforge[all]" pytest pytest-cov pytest-timeout openai pyyaml reportlab python-docx
      - name: Tests with coverage
        working-directory: packages/markitforge
        run: |
          pytest -q --timeout 300 --cov=markitforge --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY --cov-fail-under=85
