version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directories:
      - "/packages/markitforge"
      - "/packages/markitforge-mcp"
      - "/packages/markitforge-ocr"
      - "/packages/markitforge-sample-plugin"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
